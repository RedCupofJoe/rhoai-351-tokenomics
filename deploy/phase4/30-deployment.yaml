apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-pricing-ui
  namespace: __UI_NAMESPACE__
  labels:
    app.kubernetes.io/name: maas-pricing-ui
    app.kubernetes.io/part-of: rhoai-tokenomics
    app.kubernetes.io/component: pricing-ui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: maas-pricing-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maas-pricing-ui
        app.kubernetes.io/part-of: rhoai-tokenomics
        app.kubernetes.io/component: pricing-ui
    spec:
      serviceAccountName: maas-pricing-ui
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: __UI_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_HOST
              value: "127.0.0.1"
            - name: LISTEN_PORT
              value: "8080"
            - name: PRICING_PATH
              value: /data/pricing.json
            - name: ADMIN_TOKEN_FILE
              value: /etc/pricing-admin/token
            - name: ADMIN_GROUPS
              value: system:cluster-admins,cluster-admins,rhods-admins,dedicated-admins
            - name: PROMETHEUS_URL
              value: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
            - name: PROMETHEUS_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: PROMETHEUS_CA_FILE
              value: /etc/service-ca/service-ca.crt
            - name: PROMETHEUS_TLS_INSECURE
              value: "false"
            - name: AUTH_REVIEW
              value: "true"
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2).read()
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2).read()
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: admin
              mountPath: /etc/pricing-admin
              readOnly: true
            - name: service-ca
              mountPath: /etc/service-ca
              readOnly: true
        - name: oauth-proxy
          image: __OAUTH_PROXY_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: https
              containerPort: 8443
          args:
            - --https-address=:8443
            - --provider=openshift
            - --openshift-service-account=maas-pricing-ui
            - --upstream=http://127.0.0.1:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --cookie-secure=true
            - --skip-provider-button=true
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: oauth-cookie
              mountPath: /etc/proxy/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maas-pricing-data
        - name: tmp
          emptyDir: {}
        - name: admin
          secret:
            secretName: maas-pricing-admin
        - name: service-ca
          configMap:
            name: openshift-service-ca
        - name: tls
          secret:
            secretName: maas-pricing-ui-tls
        - name: oauth-cookie
          secret:
            secretName: maas-pricing-oauth-cookie
