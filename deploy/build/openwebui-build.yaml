apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: open-webui
  namespace: __CARAVAN_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: caravan
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: open-webui
  namespace: __CARAVAN_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: caravan
spec:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 6Gi
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: openwebui/Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: open-webui:0.1.0
  triggers: []
