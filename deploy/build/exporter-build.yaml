apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: maas-tokenomics-exporter
  namespace: __FINOPS_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: rhoai-tokenomics
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: maas-tokenomics-exporter
  namespace: __FINOPS_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: rhoai-tokenomics
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: exporter/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: maas-tokenomics-exporter:0.1.0
  triggers: []
