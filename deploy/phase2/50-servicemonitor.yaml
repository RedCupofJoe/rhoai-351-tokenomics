apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: maas-tokenomics-exporter
  namespace: __FINOPS_NAMESPACE__
  labels:
    app.kubernetes.io/name: maas-tokenomics-exporter
    app.kubernetes.io/part-of: rhoai-tokenomics
    app.kubernetes.io/component: exporter
spec:
  namespaceSelector:
    matchNames:
      - __FINOPS_NAMESPACE__
  selector:
    matchLabels:
      app.kubernetes.io/name: maas-tokenomics-exporter
      app.kubernetes.io/part-of: rhoai-tokenomics
      app.kubernetes.io/component: exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scheme: http
      # Keep labels the exporter sets. OpenShift still writes its own namespace
      # label for the scrape target, so the usage project is the project label.
      honorLabels: true
