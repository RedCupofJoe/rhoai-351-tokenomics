# Standalone exporter. Do not add this container to a MaaS Deployment or
# StatefulSet. OpenShift AI operators revert those objects. This Deployment
# only reads MLflow or receives logs forwarded to /v1/usage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-tokenomics-exporter
  namespace: __FINOPS_NAMESPACE__
  labels:
    app.kubernetes.io/name: maas-tokenomics-exporter
    app.kubernetes.io/part-of: rhoai-tokenomics
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: maas-tokenomics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maas-tokenomics-exporter
        app.kubernetes.io/part-of: rhoai-tokenomics
        app.kubernetes.io/component: exporter
    spec:
      serviceAccountName: maas-tokenomics-exporter
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: __EXPORTER_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: maas-tokenomics-exporter
          env:
            - name: CHECKPOINT_PATH
              value: /data/checkpoint.db
            - name: LISTEN_PORT
              value: "8080"
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maas-tokenomics-credentials
                  key: ingest-token
            - name: MLFLOW_TRACKING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maas-tokenomics-credentials
                  key: mlflow-token
                  optional: true
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: maas-tokenomics-credentials
                  key: litellm-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maas-tokenomics-checkpoint
        - name: tmp
          emptyDir: {}
