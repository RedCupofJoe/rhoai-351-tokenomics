apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maas-tokenomics-exporter
  namespace: __FINOPS_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: rhoai-tokenomics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: maas-tokenomics-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: __UI_NAMESPACE__
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-logging
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 5000
