apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: __CARAVAN_NAMESPACE__
  labels:
    app: open-webui
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: caravan
    app.kubernetes.io/component: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/part-of: caravan
        app.kubernetes.io/component: open-webui
    spec:
      serviceAccountName: open-webui
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          image: __OPENWEBUI_IMAGE__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOST
              value: 127.0.0.1
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /data/huggingface
            - name: LD_LIBRARY_PATH
              value: /usr/local/lib
            - name: OPENAI_API_BASE_URL
              value: __OPENAI_BASE_URL__
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: caravan-agent-secret
                  key: OPENAI_API_KEY
            - name: DEFAULT_MODELS
              value: __OPENAI_MODEL__
            - name: WEBUI_AUTH
              value: "false"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secret
                  key: WEBUI_SECRET_KEY
          startupProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2).read()
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2).read()
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2).read()
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        - name: oauth-proxy
          image: __OAUTH_PROXY_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: https
              containerPort: 8443
          args:
            - --https-address=:8443
            - --provider=openshift
            - --openshift-service-account=open-webui
            - --upstream=http://127.0.0.1:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --cookie-secure=true
            - --skip-provider-button=true
            - --pass-user-headers=true
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: oauth-cookie
              mountPath: /etc/proxy/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: open-webui-tls
        - name: oauth-cookie
          secret:
            secretName: open-webui-oauth-cookie
