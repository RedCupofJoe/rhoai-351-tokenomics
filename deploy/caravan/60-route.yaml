apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: open-webui
  namespace: __CARAVAN_NAMESPACE__
  labels:
    app: open-webui
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: caravan
    app.kubernetes.io/component: open-webui
spec:
  to:
    kind: Service
    name: open-webui
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
