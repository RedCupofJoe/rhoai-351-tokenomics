# Unused. Phase 5 deploys deploy/caravan/35-ojoseph-test-agent.yaml instead.
# Applying this file would replace that Deployment with CARAVAN_AGENT_IMAGE.
# This repository does not contain that application's source.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ojoseph-test-agent
  namespace: __CARAVAN_NAMESPACE__
  labels:
    app: ojoseph-test-agent
    app.kubernetes.io/name: ojoseph-test-agent
    app.kubernetes.io/part-of: caravan
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ojoseph-test-agent
  template:
    metadata:
      labels:
        app: ojoseph-test-agent
        app.kubernetes.io/name: ojoseph-test-agent
        app.kubernetes.io/part-of: caravan
        app.kubernetes.io/component: agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ojoseph-test-agent
          image: __CARAVAN_AGENT_IMAGE__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: OPENAI_BASE_URL
              value: __OPENAI_BASE_URL__
            - name: OPENAI_MODEL
              value: __OPENAI_MODEL__
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ojoseph-test-agent-secret
                  key: OPENAI_API_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
