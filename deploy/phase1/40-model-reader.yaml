# Lets the pricing UI list the models MaaS is serving. It does not change those objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maas-tokenomics-model-reader
  labels:
    app.kubernetes.io/part-of: rhoai-tokenomics
    app.kubernetes.io/component: pricing-ui
rules:
  - apiGroups: ["maas.opendatahub.io"]
    resources: ["maasmodelrefs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: __UI_NAMESPACE__-model-reader
  labels:
    app.kubernetes.io/part-of: rhoai-tokenomics
    app.kubernetes.io/component: pricing-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maas-tokenomics-model-reader
subjects:
  - kind: ServiceAccount
    name: maas-pricing-ui
    namespace: __UI_NAMESPACE__
