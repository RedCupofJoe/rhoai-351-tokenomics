apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: maas-tokenomics
  namespace: __OBS_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: rhoai-tokenomics
    app.kubernetes.io/component: dashboard
spec:
  resyncPeriod: 5m
  folder: RHOAI Observability
  instanceSelector:
    matchLabels:
      dashboards: __GRAFANA_LABEL__
  configMapRef:
    name: maas-tokenomics-dashboard
    key: tokenomics.json
